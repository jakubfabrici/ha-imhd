[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:socketio.*"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "BLE", "C4", "D", "E", "F", "FLY", "G", "I", "INP", "LOG",
  "N", "PERF", "PGH", "PIE", "PL", "PT", "RET", "RSE", "RUF", "S", "SIM", "SLF",
  "T20", "TC", "TID", "UP", "W",
]
ignore = [
  "D202",    # blank line after docstring
  "D203",    # conflicts with D211
  "D213",    # conflicts with D212
  "PLR0911", # too many return statements
  "PLR0913", # too many arguments
  "PLR2004", # magic values
  "TC001", "TC002", "TC003",  # HA style keeps runtime imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC110", "BLE001", "D", "INP001", "PLR0915", "S101", "SLF001"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant", "pytest_homeassistant_custom_component"]

[tool.ruff.lint.pydocstyle]
convention = "google"
